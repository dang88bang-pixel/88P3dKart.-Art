# 3dxAgent BLE Zubehör Firmware – nRF52840 + BMI270 + BME280
# Unterstützt: Token, Sensor-Tag, Wearable, Asset-Tag, Remote, Gateway

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="3dxAgent-Zubehör"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_L2CAP_TX_MTU=247

CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3
CONFIG_BT_GATT_CLIENT=y

CONFIG_BT_SMP=y
CONFIG_BT_CONN_TX_MAX=5

CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_ESS=y
CONFIG_BT_HRS=y

CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_BME280=y
CONFIG_BME280_TRIGGER_NONE=y
CONFIG_SHT4X=y
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y

CONFIG_BT_GATT_CACHING=n

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_FPU=y

# Power Management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Defaults – überschreibbar via Kconfig / board overlay
CONFIG_ACCESSORY_TYPE_TOKEN=y
CONFIG_PROTOCOL_VERSION=2
CONFIG_ADV_INTERVAL_MS=200
CONFIG_ENABLE_GATT_SERVICE=y
CONFIG_ENABLE_BATTERY_SERVICE=y
CONFIG_ENABLE_DEVICE_INFO=y
CONFIG_HAS_BUTTON=y
CONFIG_HAS_LED=y
CONFIG_LOW_BATTERY_THRESHOLD=15

CONFIG_CPLUSPLUS=n
