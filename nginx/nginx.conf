worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ─── Web-Visualizer (Port 3000) ─────────────────────────
    upstream visualizer {
        server web-visualizer:3000;
    }

    # ─── Edge-Agent (Port 8080) ─────────────────────────────
    upstream edge_agent {
        server edge-agent:8080;
    }

    server {
        listen 80;
        server_name _;

        # Web-Visualizer
        location / {
            proxy_pass http://visualizer;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # REST-API des Edge-Agents
        location /api/ {
            proxy_pass http://edge_agent;
            proxy_set_header Host $host;
        }
    }

    # HTTPS (Zertifikate unter ./ssl ablegen)
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            proxy_pass http://visualizer;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://edge_agent;
            proxy_set_header Host $host;
        }
    }
}
