# Gradle-Wrapper-Konfiguration
# Version 8.7 ist kompatibel mit AGP 8.2.2 (Android Gradle Plugin).
# Die Distribution wird beim ersten Build automatisch von
# services.gradle.org heruntergeladen — das ist OK in GitHub-Actions,
# aber lokale Builds brauchen entsprechenden Internet-Zugang.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
