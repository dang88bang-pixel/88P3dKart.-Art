# 3dxAgent MQTT-Broker
listener 1883
protocol mqtt

# WebSockets für MQTT (Browser-/Relay-Clients)
listener 9001
protocol websockets

# Persistenz
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Offener Broker für das Edge-Netzwerk (Produktivbetrieb absichern!)
allow_anonymous true
