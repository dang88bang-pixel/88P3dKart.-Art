# Fail-closed MQTT configuration. Provision certificates, the WebSocket
# password file, and certificate common names/ACL identities outside Git before
# enabling the `mqtt` Docker Compose profile.
per_listener_settings true

listener 8883
protocol mqtt
allow_anonymous false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
acl_file /mosquitto/config/acl

listener 9002
protocol websockets
allow_anonymous false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
connection_messages true
