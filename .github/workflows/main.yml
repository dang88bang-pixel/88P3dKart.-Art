name: Edge-Agent CI

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edge-agent/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==7.4.3 pytest-asyncio==0.23.8

      - name: Tests (neutrale Suite)
        run: >
          python -m pytest tests/ -q
          --ignore=tests/test_tactical.py
          --ignore=tests/test_radar_processing.py
          --ignore=tests/test_uwb.py

      - name: Import-Selbsttest (App startfähig)
        run: python -c "from agent import app; print('Routen:', len(app.routes))"
