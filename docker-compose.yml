version: '3.8'

services:
  # 1. Edge-Agent (Python) — Fusions-Kernel
  edge-agent:
    build: ./edge-agent
    container_name: edge-agent
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - ./data:/data
      - ./logs:/var/log/agent
    environment:
      - AGENT_DB_PATH=/data/agent.db
      - AGENT_LOG_DIR=/var/log/agent
      - AGENT_LOOP_HZ=20
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 2. Web-Visualizer (Node.js + Three.js)
  web-visualizer:
    build: ./web-visualizer
    container_name: web-visualizer
    ports:
      - "3000:3000"
    environment:
      - AGENT_WS_URL=ws://edge-agent:8080/ws/agent/events
      - PORT=3000
    depends_on:
      - edge-agent
    restart: unless-stopped

  # 3. MQTT-Broker (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  # 4. Nginx Reverse Proxy (optional, HTTPS)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-visualizer
      - edge-agent
    restart: unless-stopped
    profiles:
      - production
