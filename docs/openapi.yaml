components:
  schemas:
    AlarmEvidenceRequest:
      properties:
        policy_id:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          title: Policy Id
        asset_id:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{1,160}$
          title: Asset Id
        source_id:
          type: string
          maxLength: 160
          minLength: 1
          title: Source Id
        cursor:
          type: string
          maxLength: 160
          minLength: 1
          title: Cursor
        estimate_status:
          type: string
          enum:
          - VALID
          - UNOBSERVABLE
          title: Estimate Status
        method:
          type: string
          maxLength: 160
          minLength: 1
          title: Method
        value_m:
          type: number
          title: Value M
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        lower_95_m:
          type: number
          title: Lower 95 M
        upper_95_m:
          type: number
          title: Upper 95 M
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Observed At
        source_ids:
          items:
            type: string
          type: array
          maxItems: 64
          minItems: 1
          title: Source Ids
        measurement_ids:
          items:
            type: string
          type: array
          maxItems: 512
          minItems: 1
          title: Measurement Ids
        calibration_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Calibration Id
        quality_flags:
          items:
            type: string
          type: array
          maxItems: 64
          title: Quality Flags
      additionalProperties: false
      type: object
      required:
      - policy_id
      - asset_id
      - source_id
      - cursor
      - estimate_status
      - method
      - value_m
      - confidence
      - lower_95_m
      - upper_95_m
      - source_ids
      - measurement_ids
      title: AlarmEvidenceRequest
      description: Kalibrierte Fusions-Evidenz für Distanz-Alarme (authoritative Gateway).
    AlarmPolicyRequest:
      properties:
        schema_version:
          type: string
          const: 1.0.0
          title: Schema Version
          default: 1.0.0
        policy_id:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          title: Policy Id
        asset_id:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{1,160}$
          title: Asset Id
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        enabled:
          type: boolean
          title: Enabled
          default: true
        metric:
          type: string
          enum:
          - RANGE_FROM_CT45P
          - RANGE_FROM_ANCHOR
          - RANGE_FROM_ZONE
          - GEOFENCE_EXIT
          - CONNECTIVITY_LOSS
          title: Metric
        reference_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Id
        threshold_m:
          type: number
          exclusiveMinimum: 0.0
          title: Threshold M
        trigger_direction:
          type: string
          enum:
          - ABOVE
          - BELOW
          - OUTSIDE
          - LOSS
          title: Trigger Direction
        decision_mode:
          type: string
          enum:
          - POSSIBLE_BREACH
          - CONFIRMED_BREACH
          title: Decision Mode
          default: CONFIRMED_BREACH
        minimum_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Minimum Confidence
        maximum_age_ms:
          type: integer
          minimum: 0.0
          title: Maximum Age Ms
        dwell_ms:
          type: integer
          minimum: 0.0
          title: Dwell Ms
        clear_dwell_ms:
          type: integer
          minimum: 0.0
          title: Clear Dwell Ms
        data_loss_dwell_ms:
          type: integer
          minimum: 0.0
          title: Data Loss Dwell Ms
        recovery_dwell_ms:
          type: integer
          minimum: 0.0
          title: Recovery Dwell Ms
        hysteresis_m:
          type: number
          minimum: 0.0
          title: Hysteresis M
        cooldown_ms:
          type: integer
          minimum: 0.0
          title: Cooldown Ms
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
          title: Severity
          default: WARNING
        data_loss_behavior:
          type: string
          enum:
          - SEPARATE_ALARM
          - FAIL_CLOSED
          - WARN_ONLY
          title: Data Loss Behavior
          default: SEPARATE_ALARM
        delivery_profile_id:
          type: string
          title: Delivery Profile Id
          default: operators
      additionalProperties: false
      type: object
      required:
      - policy_id
      - asset_id
      - revision
      - metric
      - threshold_m
      - trigger_direction
      - minimum_confidence
      - maximum_age_ms
      - dwell_ms
      - clear_dwell_ms
      - data_loss_dwell_ms
      - recovery_dwell_ms
      - hysteresis_m
      - cooldown_ms
      title: AlarmPolicyRequest
      description: Gateway-autoritative Alarmrichtlinie (docs/contracts/alarm-policy.schema.json).
    AlarmSnoozeRequest:
      properties:
        duration_ms:
          type: integer
          maximum: 86400000.0
          minimum: 1.0
          title: Duration Ms
      type: object
      required:
      - duration_ms
      title: AlarmSnoozeRequest
      description: 'Alarm-Snooze: Dauer in Millisekunden (max. 24 h).'
    AuraHeatmapRequest:
