<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3dxAgent — Web Visualizer + Bluetooth Zubehör</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="ui-overlay">
        <h1>🧭 3dxAgent Live</h1>
        <div id="status">🟡 Verbinde...</div>
        <div id="scenario-status">⏸️ Bereit</div>
        <div id="aura-status">📡 RF-Feld: wartet auf Daten</div>
        <div id="tri-status">📶 Triangulation: —</div>
        <div id="net-status">🌐 Netzwerk: wartet auf Topologie</div>
        <div id="floorplan-status">🌆 Grundriss: wartet auf Daten</div>
        <div id="device-status">🛰️ Geräte: —</div>
    </div>
    <div class="badge">🔒 Lokal</div>
    <div id="attribution"></div>

    <div id="bt-panel">
        <h3>📡 Bluetooth-Zubehör</h3>
        <div id="bt-filters">
            <button data-filter="all" class="active">Alle</button>
            <button data-filter="TOKEN_PRO">Tokens</button>
            <button data-filter="SENSOR_TAG">Sensoren</button>
            <button data-filter="WEARABLE">Wearables</button>
            <button data-filter="ASSET_TAG">Assets</button>
            <button data-filter="REMOTE_CONTROLLER">Remote</button>
        </div>
        <div id="bt-list">Keine Geräte erkannt</div>
        <div id="bt-health">
            <div>🟢 Healthy: <span id="bt-healthy">0</span></div>
            <div>🟡 Degraded: <span id="bt-degraded">0</span></div>
            <div>🔴 Critical: <span id="bt-critical">0</span></div>
            <div>⚪ Lost: <span id="bt-lost">0</span></div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-evacuation">🚨 Evakuierung</button>
        <button id="btn-tactical">🎯 Taktik</button>
        <button id="btn-aura">📡 RF-Feld</button>
        <button id="btn-triangulation" class="active">📶 Triang.</button>
        <button id="btn-network" class="active">🌐 Topologie</button>
        <button id="btn-floorplan" class="active">🌆 Grundriss</button>
        <button id="btn-devices" class="active">🛰️ Geräte</button>
        <button id="btn-devicedb">🗃️ Geräte-DB</button>
        <button id="btn-tactical">🎯 Szenario</button>
        <button id="btn-tactical-stress" class="active">🛡️ Stress <span style="font-size:9px">(ALLES AKTIV)</span></button>
        <button id="btn-stop" class="stop">⏹️ Stopp</button>
        <button id="btn-bt-scan">📡 BT Scan</button>
    </div>

    <div id="devicedb-panel" class="panel hidden">
        <div class="panel-header">
            🗃️ Offline-Gerätedatenbank
            <button id="devicedb-close" class="panel-close" title="Schließen">✖</button>
        </div>
        <div id="devicedb-summary">Lädt…</div>
        <div class="devicedb-row">
            <input id="devicedb-company" placeholder="Company-ID (z. B. 0x004C)" spellcheck="false">
            <button id="devicedb-company-btn">Hersteller?</button>
        </div>
        <div id="devicedb-company-result"></div>
        <div class="devicedb-row">
            <input id="devicedb-search" placeholder="Suche: Thread · Dragino · Hue · Oura …" spellcheck="false">
            <select id="devicedb-tech" title="Technologie-Filter"></select>
            <select id="devicedb-cat" title="Kategorie-Filter"></select>
        </div>
        <div id="devicedb-results"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
    <script>
        // Offline-App-Shell: Service Worker registrieren (docs/SERVICE_WORKER.md)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch((err) => console.warn('Service-Worker-Registrierung:', err));
            });
        }
    </script>
</body>
</html>
