<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3dxAgent — Web Visualizer + Bluetooth Zubehör</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="ui-overlay">
        <h1>🧭 3dxAgent Live</h1>
        <div id="status">🟡 Verbinde...</div>
        <div id="scenario-status">⏸️ Bereit</div>
        <div id="bt-stats" style="margin-top:10px;font-size:12px;color:#aaffff;">📡 BT: --</div>
    </div>
    <div class="badge">🔒 Lokal</div>

    <div id="bt-panel">
        <h3>📡 Bluetooth-Zubehör</h3>
        <div id="bt-filters">
            <button data-filter="all" class="active">Alle</button>
            <button data-filter="TOKEN_PRO">Tokens</button>
            <button data-filter="SENSOR_TAG">Sensoren</button>
            <button data-filter="WEARABLE">Wearables</button>
            <button data-filter="ASSET_TAG">Assets</button>
            <button data-filter="REMOTE_CONTROLLER">Remote</button>
        </div>
        <div id="bt-list">Keine Geräte erkannt</div>
        <div id="bt-health">
            <div>🟢 Healthy: <span id="bt-healthy">0</span></div>
            <div>🟡 Degraded: <span id="bt-degraded">0</span></div>
            <div>🔴 Critical: <span id="bt-critical">0</span></div>
            <div>⚪ Lost: <span id="bt-lost">0</span></div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-evacuation">🚨 Evakuierung</button>
        <button id="btn-tactical">🎯 Taktik</button>
        <button id="btn-stop" class="stop">⏹️ Stopp</button>
        <button id="btn-bt-scan">📡 BT Scan</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
